<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octant Blog</title>
    <meta name="description" content="Octant community blog" />
    <meta property="og:title" content="Octant Blog" />
    <meta property="og:description" content="Octant community blog" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" />
    <script>
      // Set theme class before first paint to avoid a flash of the wrong theme.
      const stored = localStorage.getItem('theme')
      const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
      document.documentElement.classList.toggle('dark', dark)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
